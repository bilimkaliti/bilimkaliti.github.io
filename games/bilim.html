<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bilim Kaliti — fan oʻyinlari</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script>try{var _t=JSON.parse(localStorage.getItem('bk_theme'));if(_t)document.documentElement.dataset.theme=_t}catch(e){}</script>
<style>
:root{--bg:#fbf7ef;--bg2:#f3ecdf;--card:#fff;--ink:#16213e;--ink2:#4a5372;--muted:#7a8099;--line:#e8e0d0;--gold:#f5b301;--good:#12a38f;--bad:#e5484d;
  --t1:#0f9d8a;--t2:#d6336c;--t3:#f08c00;--t4:#7048e8;--sh:0 1px 2px rgba(22,33,62,.06),0 10px 28px rgba(22,33,62,.08);--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11152a;--bg2:#171c36;--card:#1c2240;--ink:#f1f2f8;--ink2:#c3c8dd;--muted:#a3a9c4;--line:#2b3257;--sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.38);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11152a;--bg2:#171c36;--card:#1c2240;--ink:#f1f2f8;--ink2:#c3c8dd;--muted:#a3a9c4;--line:#2b3257;--sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.38);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1000px 500px at 90% -10%,color-mix(in srgb,var(--mc,#7048e8) 14%,transparent),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px}
a{color:inherit}
/* setup */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 14px}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--muted);text-decoration:none;padding:8px 14px 8px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card)}
.back:hover{color:var(--ink);border-color:var(--gold)}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:900;text-decoration:none}.brand span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#ffd25c,#f5b301)}.brand b{color:var(--gold)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:24px 28px;color:#fff;background:linear-gradient(135deg,var(--mc),var(--mc2));box-shadow:0 16px 36px color-mix(in srgb,var(--mc) 30%,transparent);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero h1{margin:0 0 6px;font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.05;font-weight:900;letter-spacing:-.6px}
.hero p{margin:0;font-weight:700;opacity:.92;max-width:62ch}
.hero .em{font-size:84px;line-height:1;filter:drop-shadow(0 10px 16px rgba(0,0,0,.25));animation:flt 3.4s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-8px) rotate(4deg)}}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:20px}.hero .em{display:none}}
.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:16px}
@media (min-width:900px){.grid{grid-template-columns:.8fr 1.2fr}}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:var(--sh);min-width:0}
.box h3{margin:0 0 8px;font-size:1.02rem;font-weight:900}
.small{color:var(--muted);font-size:.9rem;font-weight:700;margin:4px 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 16px;font-weight:800;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.names input{border:2px solid var(--tc);background:var(--bg);border-radius:12px;padding:9px 12px;font-weight:800;width:100%;min-width:0}
details.adv{margin-top:16px;border:2px dashed var(--line);border-radius:14px;padding:4px 14px}
details.adv[open]{padding-bottom:14px}
details.adv summary{cursor:pointer;list-style:none;padding:10px 0;font-weight:800}
details.adv summary::-webkit-details-marker{display:none}
details.adv h3{margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;font-weight:800;margin-top:12px}.chk input{width:20px;height:20px;accent-color:var(--gold)}
.fanrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
#fanSel{font-weight:800;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-width:220px;max-width:100%}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.sets label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:800;background:var(--bg);cursor:pointer;min-height:52px;line-height:1.2}
.sets label:has(input:checked){border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card))}
.sets input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.sets small{display:block;color:var(--muted);font-weight:700;font-size:.8rem}
.sets h4{grid-column:1/-1;margin:8px 0 0;color:var(--muted);font-size:.9rem}
.empty{grid-column:1/-1;padding:16px;border:2px dashed var(--line);border-radius:14px;text-align:center;font-weight:700;color:var(--muted)}
.empty a{display:inline-block;margin:8px 4px 0;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 14px;text-decoration:none;font-weight:800}
.err{color:var(--bad);font-weight:800;min-height:1.4em;margin:10px 0 0;text-align:center}
.gobar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;margin:8px 0 60px}
.go{border:0;border-radius:18px;padding:16px 46px;min-width:min(340px,100%);font-size:1.35rem;font-weight:900;color:#1b1400;background:linear-gradient(135deg,#ffd25c,#f5b301);box-shadow:0 12px 28px rgba(245,179,1,.4);transition:transform .15s}
.go:hover{transform:translateY(-2px)}.go:active{transform:translateY(1px)}
/* play */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(10px);border:1.5px solid var(--line);border-radius:18px;padding:8px 10px 8px 14px;box-shadow:var(--sh)}
.ttl{font-weight:900;font-size:1.2rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:.8em;font-weight:800;background:var(--bg);border:1.5px solid var(--line);border-radius:99px;padding:2px 10px}
.right{display:flex;gap:6px;flex-wrap:wrap}
.chip,.ghost{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:800;min-height:40px}
.ghost:hover{border-color:var(--gold)}
.scores{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.sc{flex:1;min-width:150px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2.5px solid color-mix(in srgb,var(--tc) 35%,var(--line));border-radius:18px;padding:10px 16px;font-weight:900;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
.sc b{font-size:1.6rem;color:var(--tc);font-variant-numeric:tabular-nums}
.sc.on{border-color:var(--tc);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 22%,transparent),var(--sh);transform:translateY(-3px)}
.sc.on span::before{content:"▶ ";color:var(--tc)}
.stage{background:var(--card);border:1.5px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:22px;min-height:52vh;position:relative;overflow:hidden}
.turn{display:inline-flex;align-items:center;gap:8px;font-weight:900;color:#fff;background:var(--tc);border-radius:99px;padding:6px 16px;margin-bottom:12px}
.prog{float:right;color:var(--muted);font-weight:800}
.tbar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin:0 0 14px}.tbar i{display:block;height:100%;background:var(--tc);transform-origin:0 50%}
.msg{min-height:1.6em;text-align:center;font-weight:900;font-size:1.15rem;margin-top:14px}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
.next{display:block;margin:14px auto 0;border:0;border-radius:14px;padding:12px 28px;font-weight:900;background:var(--ink);color:var(--bg);font-size:1.05rem}
/* togri */
.stmt{font-size:clamp(1.4rem,3.2vw,2.3rem);font-weight:900;text-align:center;line-height:1.25;margin:18px auto 8px;max-width:30ch}
.stmt small{display:block;font-size:.55em;color:var(--muted);margin-bottom:8px}
.stmt .an{display:inline-block;margin-top:10px;padding:4px 16px;border-radius:14px;background:color-mix(in srgb,var(--mc) 12%,var(--bg))}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px;margin:24px auto 0}
.tfb button{border:0;border-radius:22px;padding:22px;font-size:clamp(1.3rem,3vw,2rem);font-weight:900;color:#fff;min-height:110px;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s,opacity .2s}
.tfb button:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tfb .y{background:linear-gradient(135deg,#20c997,#0f9d8a)}.tfb .n{background:linear-gradient(135deg,#ff6b6b,#e5484d)}
.tfb button:disabled{opacity:.45}.tfb button.pick{outline:5px solid var(--ink);outline-offset:3px;opacity:1}
/* jlash */
.jcols{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px;margin-top:6px}
.jcol{display:grid;gap:10px;align-content:start}
.jc{text-align:left;border:2.5px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 14px;font-weight:800;min-height:58px;line-height:1.25;box-shadow:0 4px 0 var(--line);transition:transform .1s,border-color .2s,background-color .2s,opacity .3s}
.jc:hover:not(:disabled){border-color:var(--tc)}
.jc.sel{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--card));transform:translateY(-2px)}
.jc.done{background:color-mix(in srgb,var(--dc) 18%,var(--card));border-color:var(--dc);box-shadow:none;cursor:default}
.jc.done::after{content:" ✓";color:var(--dc);font-weight:900}
.jc.wrong{animation:shk .4s;border-color:var(--bad)}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* tartib */
.ttq{font-size:clamp(1.2rem,2.6vw,1.7rem);font-weight:900;text-align:center;margin:6px 0 16px}
.slots{display:grid;gap:10px;max-width:760px;margin:0 auto}
.slot{display:flex;align-items:center;gap:12px;border:2.5px dashed var(--line);border-radius:16px;min-height:58px;padding:8px 12px;font-weight:800;background:var(--bg)}
.slot>b{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--bg2);font-weight:900}
.slot.full{border-style:solid;border-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--card));cursor:pointer}
.slot.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}.slot.ok>b{background:var(--good);color:#fff}
.slot.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}.slot.no>b{background:var(--bad);color:#fff}
.slot small{margin-left:auto;color:var(--good);font-weight:900}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px auto 0;max-width:900px}
.card{border:2.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 16px;font-weight:800;min-height:54px;box-shadow:0 4px 0 var(--line);max-width:100%;text-align:left}
.card:hover{border-color:var(--tc)}.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.check{display:block;margin:18px auto 0;border:0;border-radius:16px;padding:14px 34px;font-weight:900;font-size:1.15rem;background:linear-gradient(135deg,#ffd25c,#f5b301);color:#1b1400}
.check:disabled{opacity:.4;cursor:default}
/* guruh */
.baskets{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:12px;margin-top:8px}
.bk{border:3px solid var(--bc);border-radius:20px;background:color-mix(in srgb,var(--bc) 8%,var(--card));padding:12px;min-height:150px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:transform .15s,box-shadow .2s}
.bk:hover{transform:translateY(-3px);box-shadow:0 10px 24px color-mix(in srgb,var(--bc) 30%,transparent)}
.bk h4{margin:0 0 4px;font-size:clamp(1rem,2vw,1.3rem);color:var(--bc);font-weight:900;text-align:center}
.bk .in{display:flex;flex-wrap:wrap;gap:6px}
.bk .in span{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:3px 9px;font-weight:800;font-size:.9rem;animation:pop .35s var(--ease)}
.bk.hint{box-shadow:0 0 0 5px color-mix(in srgb,var(--bc) 45%,transparent)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.word{display:block;width:max-content;max-width:100%;margin:0 auto 18px;font-size:clamp(1.6rem,4vw,2.6rem);font-weight:900;padding:12px 28px;border-radius:20px;background:var(--card);border:3px solid var(--tc);box-shadow:0 8px 0 color-mix(in srgb,var(--tc) 40%,transparent);animation:pop .4s var(--ease)}
@media (max-width:700px){.baskets{grid-template-columns:1fr 1fr}.jcols{gap:10px}.tfb{gap:10px}.stage{padding:14px}}
/* end */
.ov{position:fixed;inset:0;background:rgba(10,14,30,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:60}
.endc{background:var(--card);border-radius:28px;padding:26px;max-width:620px;width:100%;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.35);animation:pop .45s var(--ease)}
.endc .cup{font-size:64px;display:inline-block;animation:flt 2s ease-in-out infinite}
.endc h2{margin:6px 0 14px;font-size:1.8rem}
.res{display:grid;gap:8px;margin:0 0 18px}
.res div{display:flex;justify-content:space-between;align-items:center;border:2px solid color-mix(in srgb,var(--tc) 40%,var(--line));border-radius:14px;padding:10px 16px;font-weight:900;font-size:1.1rem}
.res div:first-child{background:color-mix(in srgb,var(--tc) 12%,var(--card))}
.res b{color:var(--tc);font-size:1.4rem}
.ebtn{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cfl{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}.cfl i{position:absolute;display:block}
#fsBtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:9px 16px;font-weight:900;font-size:15px;background:color-mix(in srgb,#16213e 88%,transparent);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.28)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="wrap">
<section id="setup">
  <div class="top"><a class="back" id="backA" href="../#/oyinlar">← Barcha oʻyinlar</a><a class="brand" id="brandA" href="../"><span>🔑</span><em style="font-style:normal">Bilim <b>Kaliti</b></em></a></div>
  <div class="hero"><div><h1 id="mTitle"></h1><p id="mDesc"></p></div><span class="em" id="mEm"></span></div>
  <div class="grid">
    <div class="box">
      <h3>👥 Kim oʻynaydi?</h3>
      <div class="seg" data-key="n"></div>
      <div class="names" id="names"></div>
      <details class="adv"><summary>⚙️ Qoʻshimcha sozlamalar</summary>
        <h3 id="lenT"></h3><div class="seg" data-key="len"></div>
        <h3>⏱ Har bir navbatga vaqt</h3><div class="seg" data-key="tm"></div>
        <label class="chk"><input type="checkbox" id="sndChk"> Tovushlar</label>
      </details>
    </div>
    <div class="box">
      <div class="fanrow"><h3 style="margin:0">Fan</h3><select id="fanSel" aria-label="Fan"></select></div>
      <h3 id="setsT">Savollar toʻplamlari</h3>
      <p class="small" id="setsHint"></p>
      <div class="seg" id="sinfSeg" style="margin:6px 0 10px"></div>
      <div class="sets" id="sets"></div>
    </div>
  </div>
  <div class="err" id="err"></div>
  <div class="gobar"><button class="go" id="startBtn">▶ Oʻyinni boshlash</button></div>
</section>

<section id="play" class="hidden">
  <div class="bar"><span class="ttl" id="ttl"></span>
    <div class="right"><span class="chip" id="timer">00:00</span><button class="ghost" id="sndBtn" aria-label="Tovush">🔊</button><button class="ghost" id="finBtn">Yakunlash</button><button class="ghost" id="setBtn">⚙ Sozlamalar</button></div></div>
  <div class="scores" id="scores"></div>
  <div class="stage" id="stage"></div>
</section>
</div>
<div class="ov hidden" id="end"><div class="endc"><div class="cup">🏆</div><h2 id="endT">Natijalar</h2><div class="res" id="res"></div>
  <div class="ebtn"><button class="go" id="again" style="min-width:0;padding:12px 26px;font-size:1.1rem">🔁 Yana oʻynash</button><button class="ghost" id="toSet">⚙ Sozlamalar</button></div></div></div>

<script>
const TG=(window.Telegram&&window.Telegram.WebApp)||null;try{if(TG){TG.ready();TG.expand()}}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const P=new URLSearchParams(location.search);
const MODES={
 togri:{icon:'✅',name:'Toʻgʻri yoki notoʻgʻri',c:['#0f9d8a','#2fb9a3'],desc:'Ekranda gap chiqadi. Navbatdagi guruh «Toʻgʻri» yoki «Notoʻgʻri»ni tanlaydi. Har bir toʻgʻri javob — 1 ball.',kinds:['tf','mc'],len:{t:'Savollar soni',o:[10,16,20,30],d:16}},
 jlash:{icon:'🔗',name:'Juftlash',c:['#2f8cff','#6aa8ff'],desc:'Chapdagi har birini oʻngdagi mos javob bilan ulang. Toʻgʻri juft topgan guruh yana yuradi.',kinds:['pair','mc'],len:{t:'Juftlar soni',o:[10,15,20],d:15}},
 tartib:{icon:'📅',name:'Tartibga sol',c:['#f08c00','#ffb347'],desc:'Kartochkalarni toʻgʻri ketma-ketlikda joylang: voqealar, bosqichlar, jarayonlar. Toʻliq toʻgʻri — 2 ball.',kinds:['order'],len:{t:'Topshiriqlar soni',o:[4,6,8,10],d:6}},
 guruh:{icon:'🗂️',name:'Guruhlarga ajrat',c:['#7048e8','#9775fa'],desc:'Soʻz yoki tushunchani toʻgʻri savatga joylang. Navbat bilan, har bir toʻgʻri javob — 1 ball.',kinds:['group'],len:{t:'Soʻzlar soni',o:[12,18,24,30],d:18}}
};
const FANS=['Matematika','Algebra','Geometriya','Boshlangʻich taʼlim','Ona tili va adabiyot','Ingliz tili','Rus tili','Tabiiy fan','Fizika','Kimyo','Biologiya','Tarix','Geografiya','Informatika','Huquq','Iqtisodiyot','Tarbiya','Texnologiya','Musiqa','Tasviriy sanʼat','Jismoniy tarbiya'];
const FAN_IC={'Matematika':'🧮','Algebra':'📐','Geometriya':'📏','Boshlangʻich taʼlim':'🎒','Ona tili va adabiyot':'📖','Ingliz tili':'🇬🇧','Rus tili':'🇷🇺','Tabiiy fan':'🌿','Fizika':'⚛️','Kimyo':'🧪','Biologiya':'🧬','Tarix':'🏛️','Geografiya':'🗺️','Informatika':'💻','Huquq':'⚖️','Iqtisodiyot':'💰','Tarbiya':'🤝','Texnologiya':'🛠️','Musiqa':'🎵','Tasviriy sanʼat':'🎨','Jismoniy tarbiya':'⚽'};

      <div class="baskets" style="--n:${it.g.length}">${it.g.map((g,i)=>`<button class="bk" data-g="${i}" style="--bc:${BC[i%4]}"><h4>${esc(g.n)}</h4><div class="in">${this.fill[i].map(w=>`<span>${esc(w)}</span>`).join('')}</div></button>`).join('')}</div><div class="msg" id="msg"></div>`);
    $('#stage').querySelector('.baskets').onclick=e=>{const b=e.target.closest('[data-g]');if(b)this.ans(+b.dataset.g,b)};startTimer(()=>this.ans(-1))},
  ans(g,b){if(this.lock)return;this.lock=1;stopTimer();const x=this.w[G.done],ok=g===x.gi,right=$(`#stage [data-g="${x.gi}"]`);
    this.fill[x.gi].push(x.w);right.querySelector('.in').insertAdjacentHTML('beforeend',`<span>${esc(x.w)}</span>`);$('#stage .word').style.visibility='hidden';
    if(ok){score(1);snd('good');setMsg('🎉 Toʻgʻri! +1 ball','good');burstEl(right,26)}else{snd('bad');right.classList.add('hint');setMsg(g<0?`⏰ Vaqt tugadi. Javob: «${x.it.g[x.gi].n}»`:`Afsus! «${x.w}» — «${x.it.g[x.gi].n}» guruhiga kiradi`,'bad')}
    setTimeout(()=>{this.lock=0;G.done++;if(G.done>=G.total)return finish();nextTurn();this.step()},ok?1200:2400)}
 }
};
function startGame(){
  const sel=cfg.sets.map(id=>SETS.find(s=>s.id===id)).filter(Boolean);
  if(!sel.length){$('#err').textContent='Kamida bitta toʻplamni belgilang.';return}
  if(sel.some(s=>s.loading)){$('#err').textContent='Toʻplam yuklanmoqda… bir soniyadan keyin qayta bosing.';return}
  const I=IMPL[MK];I.lock=0;const er=I.init();if(er){$('#err').textContent=er+' Boshqa toʻplamni tanlang.';return}
  $('#err').textContent='';save();
  G.teams=Array.from({length:cfg.n},(_,i)=>({name:cfg.n===1?'Oʻquvchi':((cfg.names[i]||'').trim()||`${i+1}-guruh`),c:TC[i],score:0}));
  G.turn=0;G.done=0;G.over=false;G.t0=Date.now();
  $('#ttl').innerHTML=`${M.icon} ${esc(M.name)} <span class="badge">${FAN_IC[cfg.fan]||'📘'} ${esc(cfg.fan)}</span>`;$('#sndBtn').textContent=cfg.sound?'🔊':'🔇';
  $('#setup').classList.add('hidden');$('#play').classList.remove('hidden');$('#end').classList.add('hidden');window.scrollTo(0,0);
  clearInterval(G.clk);G.clk=setInterval(()=>{const s=Math.floor((Date.now()-G.t0)/1000);$('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
  drawScores();I.step()}
function finish(){if(G.over)return;G.over=true;stopTimer();clearInterval(G.clk);
  const r=G.teams.slice().sort((a,b)=>b.score-a.score),top=r[0].score,win=r.filter(t=>t.score===top);
  $('#endT').textContent=G.teams.length===1?`Natija: ${top} ball`:win.length>1?'Durang! 🤝':`🏆 ${win[0].name} gʻolib!`;
  $('#res').innerHTML=r.map((t,i)=>`<div style="--tc:${t.c}"><span>${i===0&&top>0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':''}${esc(t.name)}</span><b>${t.score}</b></div>`).join('');
  $('#end').classList.remove('hidden');snd('win');const w=innerWidth;burst(w*.3,innerHeight*.35,70,2.2);setTimeout(()=>burst(w*.7,innerHeight*.35,70,2.2),250)}
$('#startBtn').onclick=startGame;$('#again').onclick=startGame;
const toSetup=()=>{G.over=true;stopTimer();clearInterval(G.clk);$('#end').classList.add('hidden');$('#play').classList.add('hidden');$('#setup').classList.remove('hidden');render()};
$('#toSet').onclick=toSetup;$('#setBtn').onclick=toSetup;
$('#finBtn').onclick=()=>{if(confirm('Oʻyinni hozir yakunlab, natijani koʻrsataylikmi?'))finish()};
$('#sndBtn').onclick=()=>{cfg.sound=cfg.sound?0:1;save();$('#sndBtn').textContent=cfg.sound?'🔊':'🔇'};
/* toʻliq ekran */
(function(){const b=document.createElement('button');b.id='fsBtn';b.type='button';const lab=()=>b.textContent=document.fullscreenElement?'🗗 Kichik ekran':'⛶ Toʻliq ekran';
  b.onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{TG&&TG.expand()})}catch(e){}};document.addEventListener('fullscreenchange',lab);lab();document.body.appendChild(b)})();
if(P.has('n'))cfg.n=Math.max(1,Math.min(4,+P.get('n')||2));
render();loadSets();
