<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bilim Kaliti — fan oʻyinlari</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script>try{var _t=JSON.parse(localStorage.getItem('bk_theme'));if(_t)document.documentElement.dataset.theme=_t}catch(e){}</script>
<style>
:root{--bg:#fbf7ef;--bg2:#f3ecdf;--card:#fff;--ink:#16213e;--ink2:#4a5372;--muted:#7a8099;--line:#e8e0d0;--gold:#f5b301;--good:#12a38f;--bad:#e5484d;
  --t1:#0f9d8a;--t2:#d6336c;--t3:#f08c00;--t4:#7048e8;--sh:0 1px 2px rgba(22,33,62,.06),0 10px 28px rgba(22,33,62,.08);--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11152a;--bg2:#171c36;--card:#1c2240;--ink:#f1f2f8;--ink2:#c3c8dd;--muted:#a3a9c4;--line:#2b3257;--sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.38);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11152a;--bg2:#171c36;--card:#1c2240;--ink:#f1f2f8;--ink2:#c3c8dd;--muted:#a3a9c4;--line:#2b3257;--sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.38);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1000px 500px at 90% -10%,color-mix(in srgb,var(--mc,#7048e8) 14%,transparent),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px}
a{color:inherit}
/* setup */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 14px}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--muted);text-decoration:none;padding:8px 14px 8px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card)}
.back:hover{color:var(--ink);border-color:var(--gold)}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:900;text-decoration:none}.brand span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#ffd25c,#f5b301)}.brand b{color:var(--gold)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:24px 28px;color:#fff;background:linear-gradient(135deg,var(--mc),var(--mc2));box-shadow:0 16px 36px color-mix(in srgb,var(--mc) 30%,transparent);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero h1{margin:0 0 6px;font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.05;font-weight:900;letter-spacing:-.6px}
.hero p{margin:0;font-weight:700;opacity:.92;max-width:62ch}
.hero .em{font-size:84px;line-height:1;filter:drop-shadow(0 10px 16px rgba(0,0,0,.25));animation:flt 3.4s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-8px) rotate(4deg)}}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:20px}.hero .em{display:none}}
.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:16px}
@media (min-width:900px){.grid{grid-template-columns:.8fr 1.2fr}}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:var(--sh);min-width:0}
.box h3{margin:0 0 8px;font-size:1.02rem;font-weight:900}
.small{color:var(--muted);font-size:.9rem;font-weight:700;margin:4px 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 16px;font-weight:800;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.names input{border:2px solid var(--tc);background:var(--bg);border-radius:12px;padding:9px 12px;font-weight:800;width:100%;min-width:0}
details.adv{margin-top:16px;border:2px dashed var(--line);border-radius:14px;padding:4px 14px}
details.adv[open]{padding-bottom:14px}
details.adv summary{cursor:pointer;list-style:none;padding:10px 0;font-weight:800}
details.adv summary::-webkit-details-marker{display:none}
details.adv h3{margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;font-weight:800;margin-top:12px}.chk input{width:20px;height:20px;accent-color:var(--gold)}
.fanrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
#fanSel{font-weight:800;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-width:220px;max-width:100%}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.sets label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:800;background:var(--bg);cursor:pointer;min-height:52px;line-height:1.2}
.sets label:has(input:checked){border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card))}
.sets input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.sets small{display:block;color:var(--muted);font-weight:700;font-size:.8rem}
.sets h4{grid-column:1/-1;margin:8px 0 0;color:var(--muted);font-size:.9rem}
.empty{grid-column:1/-1;padding:16px;border:2px dashed var(--line);border-radius:14px;text-align:center;font-weight:700;color:var(--muted)}
.empty a{display:inline-block;margin:8px 4px 0;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 14px;text-decoration:none;font-weight:800}
.err{color:var(--bad);font-weight:800;min-height:1.4em;margin:10px 0 0;text-align:center}
.gobar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;margin:8px 0 60px}
.go{border:0;border-radius:18px;padding:16px 46px;min-width:min(340px,100%);font-size:1.35rem;font-weight:900;color:#1b1400;background:linear-gradient(135deg,#ffd25c,#f5b301);box-shadow:0 12px 28px rgba(245,179,1,.4);transition:transform .15s}
.go:hover{transform:translateY(-2px)}.go:active{transform:translateY(1px)}
/* play */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(10px);border:1.5px solid var(--line);border-radius:18px;padding:8px 10px 8px 14px;box-shadow:var(--sh)}
.ttl{font-weight:900;font-size:1.2rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:.8em;font-weight:800;background:var(--bg);border:1.5px solid var(--line);border-radius:99px;padding:2px 10px}
.right{display:flex;gap:6px;flex-wrap:wrap}
.chip,.ghost{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:800;min-height:40px}
.ghost:hover{border-color:var(--gold)}
.scores{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.sc{flex:1;min-width:150px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2.5px solid color-mix(in srgb,var(--tc) 35%,var(--line));border-radius:18px;padding:10px 16px;font-weight:900;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
.sc b{font-size:1.6rem;color:var(--tc);font-variant-numeric:tabular-nums}
.sc.on{border-color:var(--tc);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 22%,transparent),var(--sh);transform:translateY(-3px)}
.sc.on span::before{content:"▶ ";color:var(--tc)}
.stage{background:var(--card);border:1.5px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:22px;min-height:52vh;position:relative;overflow:hidden}
.turn{display:inline-flex;align-items:center;gap:8px;font-weight:900;color:#fff;background:var(--tc);border-radius:99px;padding:6px 16px;margin-bottom:12px}
.prog{float:right;color:var(--muted);font-weight:800}
.tbar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin:0 0 14px}.tbar i{display:block;height:100%;background:var(--tc);transform-origin:0 50%}
.msg{min-height:1.6em;text-align:center;font-weight:900;font-size:1.15rem;margin-top:14px}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
.next{display:block;margin:14px auto 0;border:0;border-radius:14px;padding:12px 28px;font-weight:900;background:var(--ink);color:var(--bg);font-size:1.05rem}
/* togri */
.stmt{font-size:clamp(1.4rem,3.2vw,2.3rem);font-weight:900;text-align:center;line-height:1.25;margin:18px auto 8px;max-width:30ch}
.stmt small{display:block;font-size:.55em;color:var(--muted);margin-bottom:8px}
.stmt .an{display:inline-block;margin-top:10px;padding:4px 16px;border-radius:14px;background:color-mix(in srgb,var(--mc) 12%,var(--bg))}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px;margin:24px auto 0}
.tfb button{border:0;border-radius:22px;padding:22px;font-size:clamp(1.3rem,3vw,2rem);font-weight:900;color:#fff;min-height:110px;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s,opacity .2s}
.tfb button:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tfb .y{background:linear-gradient(135deg,#20c997,#0f9d8a)}.tfb .n{background:linear-gradient(135deg,#ff6b6b,#e5484d)}
.tfb button:disabled{opacity:.45}.tfb button.pick{outline:5px solid var(--ink);outline-offset:3px;opacity:1}
/* jlash */
.jcols{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px;margin-top:6px}
.jcol{display:grid;gap:10px;align-content:start}
.jc{text-align:left;border:2.5px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 14px;font-weight:800;min-height:58px;line-height:1.25;box-shadow:0 4px 0 var(--line);transition:transform .1s,border-color .2s,background-color .2s,opacity .3s}
.jc:hover:not(:disabled){border-color:var(--tc)}
.jc.sel{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--card));transform:translateY(-2px)}
.jc.done{background:color-mix(in srgb,var(--dc) 18%,var(--card));border-color:var(--dc);box-shadow:none;cursor:default}
.jc.done::after{content:" ✓";color:var(--dc);font-weight:900}
.jc.wrong{animation:shk .4s;border-color:var(--bad)}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* tartib */
.bigem{font-size:clamp(3.2rem,9vh,5.5rem);line-height:1.1}.ttq{font-size:clamp(1.2rem,2.6vw,1.7rem);font-weight:900;text-align:center;margin:6px 0 16px}
.slots{display:grid;gap:10px;max-width:760px;margin:0 auto}
.slot{display:flex;align-items:center;gap:12px;border:2.5px dashed var(--line);border-radius:16px;min-height:58px;padding:8px 12px;font-weight:800;background:var(--bg)}
.slot>b{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--bg2);font-weight:900}
.slot.full{border-style:solid;border-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--card));cursor:pointer}
.slot.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}.slot.ok>b{background:var(--good);color:#fff}
.slot.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}.slot.no>b{background:var(--bad);color:#fff}
.slot small{margin-left:auto;color:var(--good);font-weight:900}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px auto 0;max-width:900px}
.card{border:2.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 16px;font-weight:800;min-height:54px;box-shadow:0 4px 0 var(--line);max-width:100%;text-align:left}
.card:hover{border-color:var(--tc)}.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.check{display:block;margin:18px auto 0;border:0;border-radius:16px;padding:14px 34px;font-weight:900;font-size:1.15rem;background:linear-gradient(135deg,#ffd25c,#f5b301);color:#1b1400}
.check:disabled{opacity:.4;cursor:default}
/* guruh */
.baskets{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:12px;margin-top:8px}
.bk{border:3px solid var(--bc);border-radius:20px;background:color-mix(in srgb,var(--bc) 8%,var(--card));padding:12px;min-height:150px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:transform .15s,box-shadow .2s}
.bk:hover{transform:translateY(-3px);box-shadow:0 10px 24px color-mix(in srgb,var(--bc) 30%,transparent)}
.bk h4{margin:0 0 4px;font-size:clamp(1rem,2vw,1.3rem);color:var(--bc);font-weight:900;text-align:center}
.bk .in{display:flex;flex-wrap:wrap;gap:6px}
.bk .in span{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:3px 9px;font-weight:800;font-size:.9rem;animation:pop .35s var(--ease)}
.bk.hint{box-shadow:0 0 0 5px color-mix(in srgb,var(--bc) 45%,transparent)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.word{display:block;width:max-content;max-width:100%;margin:0 auto 18px;font-size:clamp(1.6rem,4vw,2.6rem);font-weight:900;padding:12px 28px;border-radius:20px;background:var(--card);border:3px solid var(--tc);box-shadow:0 8px 0 color-mix(in srgb,var(--tc) 40%,transparent);animation:pop .4s var(--ease)}

.split{display:grid;gap:12px;grid-template-columns:repeat(var(--n),1fr)}
.split.g4{grid-template-columns:1fr 1fr}
.pn{background:#fff;border:3px solid var(--tc);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:260px}
.pn .ph{display:flex;justify-content:space-between;align-items:center;font-weight:900;color:var(--tc)}
.fire{color:#e8590c;font-weight:900;margin-left:auto;margin-right:10px}.fire.pop{animation:fpop .5s}@keyframes fpop{0%{transform:scale(.6)}60%{transform:scale(1.4)}100%{transform:scale(1)}}.rp{font-style:normal;font-size:.8em;background:#fff3bf;border-radius:8px;padding:1px 8px;color:#8a6100;margin-left:8px}
.pn .ph em{font-style:normal;color:#6b7280;font-size:.85em}
.pn .stmt{flex:1;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center}
.pn .fin{flex:1;display:flex;align-items:center;justify-content:center;font-size:1.4em;font-weight:900;color:var(--tc);text-align:center}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{aspect-ratio:1;border:0;border-radius:14px;background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#fff));color:#fff;font-weight:900;font-size:1.4rem;cursor:pointer;min-height:46px;box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 60%,#000)}
.cell.pos{background:var(--good);box-shadow:none}.cell.neg{background:var(--bad);box-shadow:none}.cell.mis{background:var(--line);color:var(--ink);box-shadow:none}.cell:disabled{cursor:default}
.mo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mo button{border:2.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-weight:800;min-height:54px;text-align:left;box-shadow:0 3px 0 var(--line)}
.mo button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--card))}.mo button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}.mo button.gone{opacity:.25}.mo button:disabled{cursor:default}
.ll{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.ll button{border:2px solid var(--tc);background:var(--card);color:var(--tc);border-radius:999px;padding:5px 12px;font-weight:800}.ll button:disabled{opacity:.35}
.lt{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}.lt .ls{width:42px;height:50px;border:2.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:1.35rem;text-transform:uppercase;background:var(--bg)}.lt .ls.full{border-style:solid;border-color:var(--tc);cursor:pointer}.lt .ls.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}.lt .ls.no{border-color:var(--bad)}
.lt .lc{width:42px;height:50px;border:2.5px solid var(--line);background:var(--card);border-radius:12px;font-weight:900;font-size:1.35rem;text-transform:uppercase;box-shadow:0 3px 0 var(--line)}
.lvl{text-align:center;font-weight:800;color:var(--muted);font-size:.9rem}
.rev{text-align:left;margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}.rev h4{margin:0 0 6px}.rev ol{margin:0;padding-left:20px;font-size:.92rem}.rev li{margin:3px 0}.rev small{color:var(--muted)}
@media (max-width:700px){.split{grid-template-columns:1fr}.split.g4{grid-template-columns:1fr}.pn{min-height:0}}
@media (max-width:700px){.baskets{grid-template-columns:1fr 1fr}.jcols{gap:10px}.tfb{gap:10px}.stage{padding:14px}}
/* end */
.ov{position:fixed;inset:0;background:rgba(10,14,30,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:60}
.endc{background:var(--card);border-radius:28px;padding:26px;max-width:620px;width:100%;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.35);animation:pop .45s var(--ease)}
.endc .cup{font-size:64px;display:inline-block;animation:flt 2s ease-in-out infinite}
.endc h2{margin:6px 0 14px;font-size:1.8rem}
.res{display:grid;gap:8px;margin:0 0 18px}
.res div{display:flex;justify-content:space-between;align-items:center;border:2px solid color-mix(in srgb,var(--tc) 40%,var(--line));border-radius:14px;padding:10px 16px;font-weight:900;font-size:1.1rem}
.res div:first-child{background:color-mix(in srgb,var(--tc) 12%,var(--card))}
.res b{color:var(--tc);font-size:1.4rem}
.ebtn{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cfl{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}.cfl i{position:absolute;display:block}
#fsBtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:9px 16px;font-weight:900;font-size:15px;background:color-mix(in srgb,#16213e 88%,transparent);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.28)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="wrap">
<section id="setup">
  <div class="top"><a class="back" id="backA" href="../#/oyinlar">← Barcha oʻyinlar</a><a class="brand" id="brandA" href="../"><span>🔑</span><em style="font-style:normal">Bilim <b>Kaliti</b></em></a></div>
  <div class="hero"><div><h1 id="mTitle"></h1><p id="mDesc"></p></div><span class="em" id="mEm"></span></div>
  <div class="grid">
    <div class="box">
      <h3>👥 Kim oʻynaydi?</h3>
      <div class="seg" data-key="n"></div>
      <div class="names" id="names"></div>
      <div id="dlBox" class="hidden"><h3 style="margin-top:14px">🎚 Daraja (savollar bazasi uchun)</h3><div class="seg" data-key="dl"></div></div>
      <div id="dirBox" class="hidden"><h3 style="margin-top:14px">🔁 Tarjima yoʻnalishi</h3><div class="seg" data-key="dir"></div></div>
      <details class="adv"><summary>⚙️ Qoʻshimcha sozlamalar</summary>
        <h3 id="lenT"></h3><div class="seg" data-key="len"></div>
        <h3>⏱ Har bir savolga vaqt</h3><div class="seg" data-key="tm"></div>
        <label class="chk"><input type="checkbox" id="sndChk"> Tovushlar</label>
      </details>
    </div>
    <div class="box">
      <div class="fanrow"><h3 style="margin:0">Fan</h3><select id="fanSel" aria-label="Fan"></select></div>
      <h3 id="setsT">Savollar toʻplamlari</h3>
      <p class="small" id="setsHint"></p>
      <div class="seg" id="sinfSeg" style="margin:6px 0 10px"></div>
      <div class="sets" id="sets"></div>
    </div>
  </div>
  <div class="err" id="err"></div>
  <div class="gobar"><button class="go" id="startBtn">▶ Oʻyinni boshlash</button></div>
</section>

<section id="play" class="hidden">
  <div class="bar"><span class="ttl" id="ttl"></span>

const APIB=()=>(TG&&TG.initData)?'':(/onrender\.com$/.test(location.hostname)?'':'https://bilim-kaliti.onrender.com');
function normIt(it){if(!it||typeof it!=='object')return null;
  const S=(x,n)=>String(x==null?'':x).trim().slice(0,n);
  if(Array.isArray(it.o)){const o=it.o.map(x=>S(x,120)).filter(Boolean).slice(0,4),c=+it.c;return o.length>=2&&c>=0&&c<o.length&&S(it.q,300)?{k:'mc',q:S(it.q,300),o,c}:null}
  if('t' in it&&S(it.q,300))return{k:'tf',q:S(it.q,300),t:it.t?1:0};
  if('b' in it&&S(it.a,160)&&S(it.b,160))return{k:'pair',a:S(it.a,160),b:S(it.b,160)};
  if(Array.isArray(it.s)){const s=it.s.map(x=>S(x,120)).filter(Boolean).slice(0,8);return s.length>=3&&new Set(s).size===s.length?{k:'order',q:S(it.q,200)||'Toʻgʻri tartibga soling',s}:null}
  if(Array.isArray(it.g)){const g=it.g.map(x=>({n:S(x&&x.n,60),w:(x&&Array.isArray(x.w)?x.w:[]).map(w=>S(w,80)).filter(Boolean).slice(0,10)})).filter(x=>x.n&&x.w.length).slice(0,4);return g.length>=2?{k:'group',q:S(it.q,200)||'Guruhlarga ajrating',g}:null}
  return null}
const usable=s=>s.items.filter(it=>M.kinds.includes(it.k)).length;
let SETS=[],LIBF={},FS=+P.get('fsinf')||0;
function numMC(x){const a=String(x.a).trim();if(!x.q||!/^-?\d{1,9}$/.test(a))return x;const n=+a,neg=n<0,sw=+(String(Math.abs(n)).split('').reverse().join(''))*(neg?-1:1);
  const c=[n+1,n-1,n+2,n-2,n+10,n-10,n+5,n-5,n*2,Math.trunc(n/2),sw,...(Math.abs(n)>=50?[n+100,n-100,n*10]:[n+3,n-3,n+4])].filter((v,i,r)=>Number.isFinite(v)&&v!==n&&(n<0||v>=0)&&r.indexOf(v)===i);
  const big=Math.abs(n)>=50,near=c.slice(0,big?8:10),far=big?c.slice(8):[],pick=shuffle(near).slice(0,big?2:3);if(big)pick.push(...shuffle(far.concat(near.filter(v=>!pick.includes(v)))).slice(0,1));
  const o=shuffle([n,...pick.slice(0,3)]).map(String);return{q:x.q,o,c:o.indexOf(a.replace(/^-0+$/,'0')),d:x.d}}
function addSet(s,extra){const items=(s.items||[]).map(x=>{if(extra&&extra.bank&&x&&!x.o&&!x.s&&!x.g&&!('b' in x)&&'a' in x)x=numMC(x);const n=normIt(x);if(n&&x&&x.d)n.d=x.d;return n}).filter(Boolean);const id=String(s.id);if(SETS.some(x=>x.id===id))return;
  SETS.push({id,name:String(s.name||'Toʻplam').slice(0,60),fan:/^(Algebra|Geometriya)$/.test(s.fan)?'Matematika':FANS.includes(s.fan)?s.fan:'',sinf:String(s.sinf||''),items,...extra})}
async function post(path,body){const r=await fetch(APIB()+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}
async function loadSets(){
  try{const r=await fetch('sets.json?v='+Date.now());if(r.ok)(await r.json()).forEach(s=>addSet({...s,id:'k-'+s.id},{fixed:1}))}catch(e){}
  let tok=null;try{tok=JSON.parse(localStorage.getItem('bk_token')||'null')}catch(e){}
  const body=TG&&TG.initData?{initData:TG.initData}:tok?{token:tok}:null;
  if(body){try{const j=await post('/api/sets',body);(j.sets||[]).forEach(s=>addSet(s,{own:1}))}catch(e){}}
  const lib=P.get('lib');if(lib){try{const j=await post('/api/lib/get',{id:lib});if(j.set){addSet({...j.set,id:'L-'+lib},{});post('/api/lib/play',{id:lib}).catch(()=>{})}}catch(e){}}
  const bz=P.get('baza'),bm=P.get('m'),bd=Math.max(0,Math.min(3,+P.get('d')||0));
  if(bz&&bm&&/^[\w-]{1,40}$/.test(bz+bm)){try{const r=await fetch('baza/'+bz+'.json?v='+BZ_V);if(r.ok){const j=await r.json();const t=(j.topics||[]).find(x=>x.id===bm);
    if(t)addSet({id:'B-'+bm+'-'+bd,name:t.name+(bd?' · '+['','Oson','Oʻrta','Qiyin'][bd]:''),fan:j.fan,items:t.items.filter(i=>!bd||i.d===bd)},{fixed:1})}}catch(e){}}
  const sid=lib?'L-'+lib:(bz&&bm)?'B-'+bm+'-'+bd:P.get('set');const s=SETS.find(x=>x.id===sid);
  if(s){cfg.sets=[s.id];if(s.fan)cfg.fan=s.fan}
  const fp=P.get('fan');if(fp&&FANS.includes(fp)&&!s)cfg.fan=fp;
  render();libForFan(cfg.fan);bankForFan(cfg.fan)}
const BANKS={'Matematika':'matematika','Ona tili va adabiyot':'ona-tili','Ingliz tili':'ingliz','Rus tili':'rus-tili'},BKL={};
async function bankForFan(f){const slug=BANKS[f];if(!slug||BKL[f])return;BKL[f]='loading';render();
  try{const r=await fetch('baza/'+slug+'.json?v='+BZ_V),j=await r.json();
    (j.topics||[]).forEach(t=>addSet({id:'BK-'+slug+'-'+t.id,name:t.name,fan:f,items:t.items},{fixed:1,bank:1,bob:t.bob||'',sinfs:(t.sinf||[]).map(String)}));BKL[f]='ok'}catch(e){BKL[f]='err'}
  render()}
async function libForFan(f){if(LIBF[f])return;LIBF[f]='loading';render();
  try{const j=await post('/api/lib/list',{fan:f,sort:'top'});(j.sets||[]).forEach(m=>{const id='L-'+m.id;if(!SETS.some(s=>s.id===id))SETS.push({id,name:String(m.name||'Toʻplam').slice(0,60),fan:f,sinf:String(m.sinf||''),items:[],remote:1,lib:m.id,n:m.n||0,kind:m.kind||(m.mc?'mc':'num')})});LIBF[f]='ok'}catch(e){LIBF[f]='err'}
  render()}
async function libItems(s){if(s.items.length||s.loading)return;s.loading=1;render();
  try{const j=await post('/api/lib/get',{id:s.lib});s.items=((j.set&&j.set.items)||[]).map(normIt).filter(Boolean);post('/api/lib/play',{id:s.lib}).catch(()=>{})}catch(e){}
  s.loading=0;if(!usable(s))cfg.sets=cfg.sets.filter(x=>x!==s.id);render()}
/* ---------- sozlamalar ---------- */
function render(){$('#dlBox').classList.toggle('hidden',!BANKS[cfg.fan]);$('#dirBox').classList.toggle('hidden',MK!=='harf');
  $('#mTitle').textContent=`${M.icon} ${M.name}`;$('#mDesc').textContent=M.desc;$('#mEm').textContent=M.icon;$('#lenT').textContent=M.len.t;
  SEGS.len=M.len.o.map(v=>[v,String(v)]);
  document.querySelectorAll('#setup .seg[data-key]').forEach(el=>{const k=el.dataset.key,cur=k==='len'?lenOf():cfg[k];el.innerHTML=SEGS[k].map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')});
  $('#names').innerHTML=Array.from({length:cfg.n},(_,i)=>`<input data-i="${i}" style="--tc:${TC[i]}" value="${esc(cfg.names[i]||'')}" maxlength="18" aria-label="${i+1}-guruh nomi">`).join('');
  $('#sndChk').checked=!!cfg.sound;
  $('#fanSel').innerHTML=FANS.map(f=>`<option value="${esc(f)}" ${f===cfg.fan?'selected':''}>${FAN_IC[f]||'📘'} ${esc(f)}</option>`).join('');
  const hint={togri:'Test savollari va «toʻgʻri/notoʻgʻri» gaplari mos keladi.',jlash:'Test savollari va «juft» toʻplamlari mos keladi.',tartib:'Faqat «tartibga sol» toʻplamlari mos keladi.',guruh:'Faqat «guruhlarga ajrat» toʻplamlari mos keladi.'}[MK];
  $('#setsHint').textContent=hint;
  const fit=s=>s.remote?(M.kinds.includes(s.kind)):usable(s)>0;
  const inF=SETS.filter(s=>s.fan===cfg.fan&&fit(s)),grs=[...new Set(inF.flatMap(s=>s.sinfs||[s.sinf]).filter(Boolean))].sort((a,b)=>a-b);
  $('#sinfSeg').innerHTML=grs.length>1?`<button type="button" data-fs="0" aria-pressed="${!FS}">Barcha sinflar</button>`+grs.map(g=>`<button type="button" data-fs="${g}" aria-pressed="${String(FS)===g}">${g}-sinf</button>`).join(''):'';
  const okS=s=>!FS||(s.sinfs?s.sinfs.includes(String(FS)):(!s.sinf||s.sinf===String(FS)))||cfg.sets.includes(s.id);
  const lab=s=>`<label><input type="checkbox" data-s="${esc(s.id)}" ${cfg.sets.includes(s.id)?'checked':''}><span>${esc(s.name)}<small>${s.loading?'yuklanmoqda…':(s.remote&&!s.items.length?(s.n||'')+' ta':usable(s)+' ta')}${s.sinf?` · ${esc(s.sinf)}-sinf`:''}${s.own?' · meniki':s.fixed?' · tayyor':s.remote?' · kutubxona':''}</small></span></label>`;
  const mine=inF.filter(s=>!s.remote&&!s.bank&&okS(s)),bank=inF.filter(s=>s.bank&&okS(s)),lib=inF.filter(s=>s.remote&&okS(s)),loose=SETS.filter(s=>!s.fan&&s.own&&fit(s));
  let html=mine.length?`<h4>⭐ Tayyor va mening toʻplamlarim</h4>${mine.map(lab).join('')}`:'';
  if(bank.length){const by={};bank.forEach(s=>(by[s.bob||'Savollar bazasi']=by[s.bob||'Savollar bazasi']||[]).push(s));html+=Object.entries(by).map(([b,a])=>`<h4>📖 ${esc(b)}</h4>${a.map(lab).join('')}`).join('')}
  else if(BANKS[cfg.fan]&&BKL[cfg.fan]==='loading')html+='<p class="small" style="grid-column:1/-1">📖 Savollar bazasi yuklanmoqda…</p>';
  html+=lib.length?`<h4>📚 Kutubxonadan</h4>${lib.map(lab).join('')}`:LIBF[cfg.fan]==='loading'?'<p class="small" style="grid-column:1/-1">📚 Kutubxona yuklanmoqda…</p>':'';
  if(!mine.length&&!lib.length&&!bank.length&&LIBF[cfg.fan]!=='loading'&&BKL[cfg.fan]!=='loading')html+=`<div class="empty">Bu fan boʻyicha «${esc(M.name)}» uchun hali toʻplam yoʻq.<br><a href="${home}#/ai/savollar" target="_top">✨ AI bilan yaratish</a><a href="${home}#/ai/darslik" target="_top">📸 Darslikdan</a></div>`;
  if(loose.length)html+=`<details style="grid-column:1/-1;margin-top:8px"><summary style="cursor:pointer;font-weight:800">Fani koʻrsatilmagan toʻplamlarim (${loose.length})</summary><div class="sets" style="margin-top:8px">${loose.map(lab).join('')}</div></details>`;
  $('#sets').innerHTML=html;
}

let AC=null;function snd(t){if(!cfg.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const T0=AC.currentTime;
  const seq={good:[[660,.09],[880,.12]],bad:[[220,.18],[180,.2]],win:[[523,.12],[659,.12],[784,.12],[1046,.3]],tick:[[900,.04]]}[t]||[];let t0=T0;
  for(const [f,d] of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=t==='bad'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(t==='bad'?.12:.22,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.03);t0+=d*.9}}catch(e){}}
const COL=['#f5b301','#ffd25c','#ff6b4a','#12a38f','#2f8cff','#7b5cff','#ff8fb1'];
function burst(x,y,n=40,sp=1.9){if(!document.body.animate)return;const L=document.createElement('div');L.className='cfl';document.body.appendChild(L);
  for(let i=0;i<n;i++){const e=document.createElement('i'),s=6+Math.random()*7;e.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s*(Math.random()<.5?.45:1)}px;background:${COL[i%COL.length]};border-radius:${Math.random()<.35?'50%':'2px'}`;L.appendChild(e);
    const a=-Math.PI/2+(Math.random()-.5)*sp,v=7+Math.random()*9,dx=Math.cos(a)*v*26,dy=Math.sin(a)*v*26;
    e.animate([{transform:'translate(-50%,-50%)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*540}deg)`,opacity:1,offset:.55},{transform:`translate(${dx*1.2}px,${dy+340}px) rotate(${Math.random()*900}deg)`,opacity:0}],{duration:1500+Math.random()*600,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'})}
  setTimeout(()=>L.remove(),2400)}
const burstEl=(el,n)=>{const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,n||36)};

const G={wr:[],teams:[],turn:0,done:0,total:0,over:true,t0:0,tmLeft:0,tmIv:null,clk:null};

function nextTurn(){G.turn=(G.turn+1)%G.teams.length;drawScores()}

function startTimer(onEnd){clearInterval(G.tmIv);if(!cfg.tm)return;G.tmLeft=cfg.tm;const tb=$('#tb');
  G.tmIv=setInterval(()=>{G.tmLeft-=.1;if(tb)tb.style.transform=`scaleX(${Math.max(0,G.tmLeft/cfg.tm)})`;if(G.tmLeft<=3&&Math.abs(G.tmLeft-Math.round(G.tmLeft))<.05)snd('tick');if(G.tmLeft<=0){clearInterval(G.tmIv);onEnd()}},100)}

 },
 harf:{
  init(){const n=cfg.n,seen=new Set(),W=[],D=cfg.dir||0,lg=cfg.fan==='Rus tili'?'ruscha':'inglizcha';
    const add=(q,w)=>{w=String(w).trim().toLowerCase();if(!/^[\p{L}ʻ’'\-]{4,10}$/u.test(w)||new Set(w).size<3||seen.has(w))return;seen.add(w);W.push({q,w})};
    for(const it of pool(['mc','pair'])){
      if(D&&it.k==='mc'){const m=/^«([^»]+)» (inglizcha|ruscha) qanday\?$/.exec(it.q),t=/^«([^»]+)» soʻzining tarjimasi qaysi\?$/.exec(it.q),Y=it.o[it.c];
        if(m){/* X — oʻzbekcha, Y — chet tili */ if(D===2)add(it.q,Y);else add(`«${Y}» soʻzining tarjimasi qaysi?`,m[1])}
        else if(t){/* X — chet tili, Y — oʻzbekcha */ if(D===1)add(it.q,Y);else add(`«${Y}» ${lg} qanday?`,t[1])}
        continue}
      if(D)continue;
      add(it.k==='mc'?it.q:it.a,it.k==='mc'?it.o[it.c]:it.b)}
    this.W=shuffle(W);this.per=Math.min(lenOf(),Math.floor(W.length/n));return this.per>=3?'':'Anagram uchun kamida '+3*n+' ta soʻz kerak (tarjima savollari bor til mavzusini tanlang).'},
  step(){const per=this.per;SP.start(this,i=>this.W.slice(i*per,(i+1)*per))},
  draw(p,it){p.it=it;p.ch=[...it.w];let sh;do{sh=shuffle(p.ch.map((_,i)=>i))}while(sh.every((x,i)=>x===i));p.free=sh;p.put=[];p.att=1;p.done=0;this.paint(p)},
  paint(p){const it=p.it,c=G.teams[p.i].c,n=p.ch.length;
    p.pb.innerHTML=`<div class="ttq">${QH(it.q)}</div><div class="lt" style="--tc:${c}">${p.ch.map((_,k)=>{const v=p.put[k];return `<div class="ls${v!=null?' full':''}${p.done===1?' ok':''}${p.done===2?' no':''}" data-p="${k}">${p.done===2?esc(p.ch[k]):v!=null?esc(p.ch[v]):''}</div>`}).join('')}</div>
      ${p.done?'':`<div class="lt" style="--tc:${c}">${p.free.map(i=>`<button class="lc" data-f="${i}">${esc(p.ch[i])}</button>`).join('')}</div>`}`;
    if(p.done)return;
    p.pb.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{if(p.lock)return;const i=+b.dataset.f;p.free=p.free.filter(x=>x!==i);p.put.push(i);snd('tick');this.paint(p);if(p.put.length===n)this.check(p)});
    p.pb.querySelectorAll('.ls.full').forEach(s=>s.onclick=()=>{if(p.lock)return;const k=+s.dataset.p;p.free.push(p.put[k]);p.put.splice(k,1);this.paint(p)})},
  check(p,tout){clearInterval(p.iv);const w=p.it.w,got=tout?'':p.put.map(i=>p.ch[i]).join('');
    if(got===w){p.done=1;this.paint(p);const pts=p.att===1?2:1;SP.add(p,pts);snd('win');SP.say(p,`🎉 Toʻgʻri! +${pts} ball`,'good');SP.next(this,p,1500);return}
    if(p.att===1&&!tout){p.att=2;p.st=0;SP.fire(p);snd('bad');p.free=shuffle(p.ch.map((_,i)=>i));p.put=[];this.paint(p);SP.say(p,'Notoʻgʻri — yana bir marta urinib koʻring (+1 ball).','bad');return}
    p.done=2;p.lock=1;this.paint(p);snd('bad');miss(p.it.q,p.it.w);SP.say(p,`${tout?'⏰ Vaqt tugadi. ':''}Toʻgʻri soʻz: ${w}`,'bad');SP.next(this,p,2600,1)},
  timeout(p){this.check(p,1)},tmul:2
 }
};

  {const m=new Map();G.wr.forEach(x=>{const e=m.get(x.q)||{...x,n:0};e.n++;m.set(x.q,e)});const L=[...m.values()].sort((a,b)=>b.n-a.n).slice(0,5);

  $('#end').classList.remove('hidden');snd('win');const w=innerWidth;burst(w*.3,innerHeight*.35,70,2.2);setTimeout(()=>burst(w*.7,innerHeight*.35,70,2.2),250)}
