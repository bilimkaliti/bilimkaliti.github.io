<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilim Kaliti — sinf uchun matematik oʻyinlar</title>
<meta name="description" content="Elektron doskada guruhlar bilan oʻynaladigan bepul matematik oʻyinlar: 1–7-sinf, har gal yangi savollar.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7ef;--bg2:#f3ecdf;--card:#ffffff;--ink:#16213e;--ink2:#4a5372;--muted:#8a90a6;--line:#e8e0d0;
  --gold:#f5b301;--gold2:#ffd25c;--teal:#0f9d8a;--coral:#ff6b4a;--violet:#7b5cff;--sky:#2f8cff;
  --shadow:0 1px 2px rgba(22,33,62,.06),0 8px 24px rgba(22,33,62,.07);--r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11152a;--bg2:#171c36;--card:#1c2240;--ink:#f1f2f8;--ink2:#c3c8dd;--muted:#8d93ad;--line:#2b3257;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#11152a;--bg2:#171c36;--card:#1c2240;--ink:#f1f2f8;--ink2:#c3c8dd;--muted:#8d93ad;--line:#2b3257;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;letter-spacing:-.3px}
.logo .k{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;font-size:20px;box-shadow:0 4px 12px rgba(245,179,1,.35);transform:rotate(-8deg)}
.logo b{color:var(--gold)}
nav.top{display:flex;gap:4px;margin-left:12px}
nav.top a{padding:8px 14px;border-radius:12px;font-weight:800;color:var(--ink2)}
nav.top a.on,nav.top a:hover{background:var(--bg2);color:var(--ink)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:800;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--ink);color:var(--bg)}
.btn.gold{background:var(--gold);color:#1b1400;box-shadow:0 6px 18px rgba(245,179,1,.35)}
.btn.ghost{background:var(--card);border:1.5px solid var(--line)}
.btn.tg{background:#229ED9;color:#fff}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:56px 0 40px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:14px;color:var(--ink2)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 25%,transparent)}
h1{font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-1.2px;margin:18px 0 16px;font-weight:900}
h1 .hl{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--gold) 55%,transparent) 62%)}
.lead{font-size:19px;color:var(--ink2);max-width:540px;margin:0 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:26px;margin-top:30px;flex-wrap:wrap}
.stats div b{display:block;font-size:28px;font-weight:900}
.stats div span{color:var(--muted);font-weight:700;font-size:14px}
/* board illustration */
.board{position:relative;background:linear-gradient(160deg,#1f2a55,#141a36);border-radius:28px;padding:18px;box-shadow:var(--shadow);border:8px solid #2a3360;aspect-ratio:4/3}
.board .q{background:rgba(255,255,255,.08);color:#fff;border-radius:16px;padding:10px 14px;font-weight:900;font-size:22px;text-align:center;margin-bottom:12px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:calc(100% - 64px)}
.team{border-radius:16px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;position:relative;overflow:hidden}
.team.a{background:linear-gradient(180deg,rgba(47,140,255,.18),rgba(47,140,255,.35))}
.team.b{background:linear-gradient(180deg,rgba(255,107,74,.18),rgba(255,107,74,.38))}
.team .lab{position:absolute;top:10px;left:12px;color:#fff;font-weight:900;font-size:14px;opacity:.9}
.floor{height:16%;border-radius:8px;animation:up .6s backwards}
.team.a .floor{background:linear-gradient(90deg,#2f8cff,#62a8ff)}
.team.b .floor{background:linear-gradient(90deg,#ff6b4a,#ff9a7f)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.robo{position:absolute;right:-14px;bottom:-18px;background:var(--card);color:var(--ink);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;transform:rotate(3deg)}
.robo span{font-size:24px}
/* sections */
section{padding:34px 0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h2{font-size:30px;letter-spacing:-.6px;margin:0;font-weight:900}
.sub{color:var(--ink2);margin:4px 0 0}
.tabs{display:inline-flex;background:var(--bg2);border-radius:16px;padding:5px;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:9px 16px;border-radius:12px;font-weight:800;color:var(--ink2)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* game cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.game{background:var(--card);border-radius:var(--r);border:1.5px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;cursor:pointer;text-align:left;padding:0}
.game:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.art{height:128px;display:grid;place-items:center;position:relative;overflow:hidden}
.art .em{font-size:62px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));transition:transform .25s}
.game:hover .art .em{transform:scale(1.1) rotate(-6deg)}
.art::before,.art::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.22)}
.art::before{width:120px;height:120px;left:-30px;top:-40px}
.art::after{width:70px;height:70px;right:18px;bottom:-24px}
.gb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gb h3{margin:0;font-size:19px;font-weight:900}
.gb p{margin:0;color:var(--ink2);font-size:14.5px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--bg2);color:var(--ink2)}
.tag.new{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.tag.soon{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--violet)}
/* grades */
.grades{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.grade{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 10px;text-align:center;transition:transform .15s,border-color .15s}
.grade:hover,.grade.on{transform:translateY(-3px);border-color:var(--gold)}
.grade b{display:block;font-size:42px;font-weight:900;line-height:1}
.grade span{font-weight:800;color:var(--muted);font-size:13px}
.grade small{display:block;margin-top:6px;color:var(--teal);font-weight:800;font-size:12.5px}
/* grade page */
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:800;margin:26px 0 6px}
.crumbs a:hover{color:var(--ink)}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:800;color:var(--ink2);display:inline-flex;gap:8px;align-items:center}
.chip i{width:18px;height:18px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px}
.chip.on{border-color:var(--teal);color:var(--ink);background:color-mix(in srgb,var(--teal) 9%,var(--card))}
.chip.on i{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.on i::after{content:"✓"}
.selbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-weight:800;margin-bottom:18px}
.link{border:0;background:none;color:var(--teal);font-weight:800;padding:4px 6px}
/* subjects & tools */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.subj{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;align-items:center;gap:12px;font-weight:800}
.subj .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--bg2)}
.subj.off{opacity:.55}
.subj small{display:block;color:var(--muted);font-size:12.5px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tool{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:14px}
.tool .ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px}
.tool h3{margin:0 0 4px;font-size:17px;font-weight:900}
.tool p{margin:0 0 8px;color:var(--ink2);font-size:14px}
/* bot banner */
.banner{background:linear-gradient(120deg,#1f2a55,#2b2170);color:#fff;border-radius:28px;padding:30px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.banner h2{color:#fff}
.banner p{color:#d4d8f0;margin:8px 0 0;max-width:620px}
.banner::after{content:"🔑";position:absolute;right:220px;top:-30px;font-size:150px;opacity:.07;transform:rotate(-20deg)}
footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 0 90px;color:var(--muted);font-weight:700;font-size:14px}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
/* mobile nav */
.mnav{display:none}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;padding-top:32px}
  .board{max-width:520px}
  .grades{grid-template-columns:repeat(4,1fr)}
  nav.top{display:none}
  .banner{grid-template-columns:1fr}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .mnav a{flex:1;text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:6px 0;border-radius:12px}
  .mnav a span{display:block;font-size:20px;line-height:1.2}
  .mnav a.on{color:var(--ink);background:var(--bg2)}
  .hide-m{display:none}
}
@media (max-width:520px){.wrap{padding:0 16px}.grades{grid-template-columns:repeat(3,1fr)}h2{font-size:25px}.stats{gap:18px}.robo{right:6px}}

/* ===== AI ===== */
.btn.big{padding:14px 26px;font-size:17px}.btn.sm{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}
.narrow{max-width:900px}
.small{font-size:13.5px;color:var(--muted);font-weight:700}
.note{margin-top:22px;color:var(--muted);font-weight:700;font-size:14px}
.aihead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.aigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.aitool{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s,border-color .15s}
.aitool:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--gold)}
.aitool .ic,.fhead .ic,.fitem .ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:27px;margin-bottom:4px;flex:none}
.aitool b{font-size:17px}.aitool small{color:var(--ink2);font-size:13.5px;line-height:1.4}
.formcard{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.fhead{display:flex;gap:14px;align-items:center;margin-bottom:18px}.fhead h2{font-size:26px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.f{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px;color:var(--ink2)}.f em{font-weight:700;color:var(--muted);font-style:normal}
.f.wide,.wide{grid-column:1/-1}
.f input,.f select,.f textarea{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.f.file input{padding:9px}
.factions{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:4px}
@media (max-width:700px){.fgrid{grid-template-columns:1fr 1fr}}
#toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:800;opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:rgba(10,14,30,.55);display:grid;place-items:center;z-index:90;padding:16px;animation:fade .2s}
.mbox{background:var(--card);border-radius:24px;padding:26px;max-width:440px;width:100%;position:relative;box-shadow:var(--shadow)}
.mbox h3{margin:0 0 8px;font-size:22px}.mx{position:absolute;top:12px;right:12px;border:0;background:var(--bg2);width:34px;height:34px;border-radius:10px}
.mrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.lg{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}.lgic{font-size:46px}
.flist{display:flex;flex-direction:column;gap:10px}
.fitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px}
.fmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0}.fitem .ic{background:var(--bg2);margin:0;width:44px;height:44px;font-size:22px}
.fmain b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fmain small{color:var(--muted);font-weight:700}
.empty{text-align:center;padding:50px 0;color:var(--ink2);font-weight:700}.empty div{font-size:54px}
.dbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px;position:sticky;top:76px;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);padding:8px 0;backdrop-filter:blur(6px)}
.dbar .btn{padding:9px 14px;font-size:14.5px}
.paper{background:#fff;color:#1d2433;border-radius:18px;padding:40px 46px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:30px;font-size:16.5px;line-height:1.6}
.paper h1{font-size:28px;line-height:1.2;margin:0 0 16px;color:#16213e}.paper h2{font-size:20px;margin:24px 0 8px;color:#16213e}
.paper .sub{color:#5a6178}.paper .small{color:#7a8094}
.paper .intro{background:#f6f2e8;border-radius:12px;padding:12px 16px}
.paper .sol{color:#2b6b4f;background:#eef8f2;border-radius:10px;padding:8px 12px}
.paper ol,.paper ul{padding-left:24px}.paper li{margin:6px 0}
.tb{border-collapse:collapse;width:100%;margin:8px 0}.tb td,.tb th{border:1px solid #d9d3c4;padding:8px 10px;vertical-align:top;text-align:left}.tb th{background:#f6f2e8;font-weight:800}
.tq>li{margin:0 0 14px}.tq p{margin:0 0 6px;font-weight:700}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 20px;color:#3d4459}
.keybox,.ans-only{display:none}.showkey .keybox{display:block}
.keys li{margin:3px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.flip{perspective:900px;height:150px;cursor:pointer;outline:none}
.flip .fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-weight:800}
.ff{background:linear-gradient(135deg,#eef3ff,#dfe8ff);color:#1c3b8a}.fb{background:linear-gradient(135deg,#e9f9f1,#d2f2e2);color:#11603f;transform:rotateY(180deg);font-weight:700}
.ff small{position:absolute;top:10px;left:14px;color:#7c8bb5;font-size:12px}
.cwrap{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
.cgrid{overflow:auto;max-width:100%}
.cw{border-collapse:collapse}.cw td{width:34px;height:34px;border:1.5px solid #3b4258;position:relative;padding:0;background:#fff}
.cw td.x{border:0;background:transparent}
.cw small{position:absolute;top:1px;left:3px;font-size:10px;font-weight:800;color:#555;line-height:1}
.cw input{width:100%;height:100%;border:0;text-align:center;font:inherit;font-weight:900;font-size:16px;text-transform:uppercase;background:transparent;color:#16213e;padding:0;outline:none}
.cw input:focus{background:#fff4c2}.cw input.good{background:#dff5e8}.cw input.bad{background:#ffe1dd}
.cw.ans span{display:grid;place-items:center;height:100%;font-weight:900}
.clues ol{padding-left:28px}.clues em{color:#888;font-style:normal}
@media (max-width:760px){.cwrap{grid-template-columns:1fr}.paper{padding:22px 18px}.opts{grid-template-columns:1fr}}
.wide-paper{background:transparent;border:0;box-shadow:none;padding:0}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.slide{aspect-ratio:16/9;border-radius:16px;padding:6% 7%;position:relative;overflow:hidden;box-shadow:var(--shadow);font-size:13px;display:flex;flex-direction:column}
.slide h3{margin:0 0 8px;font-size:1.6em;line-height:1.15;font-weight:900;padding-right:18%}
.slide ul{margin:6px 0 0;padding-left:1.2em}.slide li{margin:3px 0;font-weight:700}
.slide li::marker{color:var(--acc)}
.slide .sem{position:absolute;right:6%;top:7%;font-size:2.8em}
.slide .snum{position:absolute;right:4%;bottom:4%;opacity:.6;font-weight:800}
.slide .snote{margin-top:auto;font-size:.9em;opacity:.75;background:rgba(0,0,0,.08);border-radius:8px;padding:4px 8px}
.slide.cover{justify-content:center}.slide.cover h3{font-size:2.2em}.slide.cover p{margin:0;opacity:.85;font-weight:700}
.slide.cover .sem{position:static;font-size:3em;margin-bottom:6px}.sbar{display:block;width:70px;height:6px;border-radius:9px;background:var(--acc);margin-top:14px}
#present{position:fixed;inset:0;z-index:200;background:#0b0f1f;display:flex;flex-direction:column}
#present .pv{flex:1;display:grid;place-items:center;padding:3vh 3vw;min-height:0}
#present .pc{display:flex;gap:10px;justify-content:center;align-items:center;padding:10px;color:#fff;font-weight:800}
.pbn{width:52px;height:46px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:26px}.pbn.px{font-size:18px;margin-left:20px}
.slide.big{width:min(94vw,calc(84vh*16/9));font-size:min(2.6vw,4.6vh);box-shadow:none}
.p-test .pv,.p-cards .pv{color:#fff}
.tshow{width:min(1100px,94vw);text-align:center}.tshow small{opacity:.7;font-weight:800;font-size:18px}
.tshow h2{font-size:clamp(26px,4.4vw,52px);line-height:1.2;margin:12px 0 28px}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.topts button{border:0;border-radius:18px;padding:22px;font-size:clamp(18px,2.6vw,30px);font-weight:800;background:rgba(255,255,255,.1);color:#fff;text-align:left;display:flex;gap:14px;align-items:center}
.topts button b{background:rgba(255,255,255,.18);border-radius:10px;padding:2px 12px}
.topts button.ok{background:#1f9d62}.topts button.no{background:#d64545}
.texp{font-size:20px;opacity:.85;margin-top:22px}
.flip.big{width:min(760px,90vw);height:min(420px,60vh)}.flip.big .ff,.flip.big .fb{font-size:clamp(22px,3.4vw,40px);border-radius:26px}
.chat{background:var(--card);border:1.5px solid var(--line);border-radius:24px;display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:440px;overflow:hidden}
.chead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:12px 15px;border-radius:18px;line-height:1.55;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.msg.model{align-self:flex-start;background:var(--bg2);border-bottom-left-radius:6px}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}.msg h4{margin:10px 0 6px}.msg ul,.msg ol{margin:4px 0 8px;padding-left:22px}
.msg pre{background:rgba(0,0,0,.08);padding:10px;border-radius:10px;overflow:auto}.msg small{display:block;opacity:.7;margin-top:4px}
.msg .trow{display:flex;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}.msg .trow span{flex:1}
.typing i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.cin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.cin textarea{flex:1;font:inherit;font-weight:700;resize:none;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--bg);color:var(--ink);outline:none;max-height:160px}
.att{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--bg2);cursor:pointer;font-size:20px;flex:none}
#cFileName{padding:0 16px 10px}
.cempty{margin:auto;text-align:center;color:var(--ink2)}.cempty div{font-size:46px}.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;max-width:640px}
.ubtn{max-width:220px}.ubtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.hide-s{display:none}.chat{height:calc(100vh - 230px)}}
@media print{
  body.printing header,body.printing footer,body.printing .mnav,body.printing .noprint,body.printing #toast{display:none!important}
  body.printing{background:#fff}
  body.printing .paper{box-shadow:none;border:0;padding:0;margin:0}
  body.printing .wrap{max-width:none;padding:0}
  body.printing .keybox,body.printing .ans-only{display:block}
  body.printing .pb{break-before:page}
  body.printing .flip .fi{transform:none!important}body.printing .flip{height:auto}
  body.printing .ff,body.printing .fb{position:static;transform:none;border:1px solid #ccc;margin:2px 0}
  body.printing .slide{break-inside:avoid;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.pr-taqdimot .slides{grid-template-columns:1fr}
  body.printing .cw td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.08;font-size:.9em;margin:0 .14em;font-variant-numeric:lining-nums}
.fr>span{padding:0 .12em}.fr>span:first-child{border-bottom:max(1.5px,.07em) solid currentColor}
.modes{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:-6px 0 18px;font-weight:800;color:var(--muted)}
.hidden{display:none!important}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}

function bindGrade(n){
  const key='topics_'+n,list=GRADES[n]||[];
  const sel=()=>[...document.querySelectorAll('#tps .chip.on')].map(b=>+b.dataset.i);
  const draw=()=>{
    const s=sel();store.set(key,s);
    $('#selc').textContent=`Tanlangan: ${s.length} ta mavzu`;
    const t=s.length===list.length?'all':s.join(','),m=store.get('mode','g'),mx={g:'&robo=0',r:'&robo=2&n=1',s:'&robo=0&n=1'}[m]||'';
    document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
    $('#sgrid').innerHTML=s.length?GAMES.filter(g=>g.f==='toplam'&&!(m==='r'&&g.g==='zanjir'&&0)).map(g=>gameCard(g,`&sinf=${n}&t=${t}${mx}`)).join(''):'<p class="sub">Kamida bitta mavzuni belgilang.</p>';
  };
  $('#modes').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;store.set('mode',b.dataset.m);draw();
    toast({g:'Guruhlar bellashadi (2–4 guruh)',r:'Bitta oʻquvchi Robo bilan bellashadi (guruhlar sonini sozlamalarda oʻzgartirsa boʻladi)',s:'Bitta oʻquvchi: rekord saqlanadi'}[b.dataset.m])};
  $('#tps').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;b.classList.toggle('on');draw()};
  $('#selAll').onclick=()=>{document.querySelectorAll('#tps .chip').forEach(b=>b.classList.add('on'));draw()};
  $('#selNone').onclick=()=>{document.querySelectorAll('#tps .chip').forEach(b=>b.classList.remove('on'));draw()};
  draw();
}
function bindGames(){

}

async function api(path,body,timeout=175000){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),timeout);
  try{
    const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{}),signal:ctl.signal});
    let j={};try{j=await r.json()}catch(e){}
    if(r.status===401){AUTH.out();throw new Error('Qaytadan kiring.')}
    if(!j.ok&&j.error)throw new Error(j.error);
    if(!r.ok&&!('ok' in j))throw new Error('Server xatosi ('+r.status+').');
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('Server javob bermadi. Birozdan keyin qayta urinib koʻring.');
    if(e instanceof TypeError)throw new Error('Serverga ulanib boʻlmadi. Internetni tekshiring va qayta urinib koʻring.');
    throw e;
  }finally{clearTimeout(tm)}
}

function login(){
  return new Promise(res=>{
    const m=modal(`<div class="lg"><div class="lgic">✈️</div><h3>Telegram orqali kirish</h3>
      <p class="sub" id="lgMsg">Server bilan bogʻlanilmoqda… Birinchi marta 1 daqiqagacha choʻzilishi mumkin.</p>
      <a class="btn tg hidden" id="lgGo" target="_blank" rel="noopener">✈️ Telegram'ni ochish</a>
      <p class="small">Botda <b>START</b> tugmasini bosing, keyin shu sahifaga qayting — kirish oʻzi bajariladi.</p></div>`);
    const my=modal.closed||0;
    api('/api/login/start',{},90000).then(async j=>{
      const go=$('#lgGo');if(!go)return;go.href=j.url;go.classList.remove('hidden');
      $('#lgMsg').textContent='Telegramʼda botni oching va START ni bosing.';
      try{window.open(j.url,'_blank','noopener')}catch(e){}
      const t0=Date.now();
      while(Date.now()-t0<9*60000&&(modal.closed||0)===my){
        await new Promise(r=>setTimeout(r,2500));
        let r;try{r=await api('/api/login/check',{code:j.code},30000)}catch(e){continue}
        if(r.ok){AUTH.set(r.token,r.name);closeModal();drawAuth();toast('Xush kelibsiz, '+r.name+'!');res(true);return}
        if(r.expired){const mm=$('#lgMsg');if(mm)mm.textContent='Havola eskirdi. Oynani yopib, qaytadan «Kirish»ni bosing.';break}
      }
      res(false);
    }).catch(e=>{const mm=$('#lgMsg');if(mm)mm.textContent=e.message;res(false)});
  });
}

/* ---------- krossvord ---------- */
function cellsOf(w){return (String(w).toUpperCase().normalize('NFC').replace(/[ʻʼ’‘`']/g,"ʻ").match(/[OG]ʻ|[A-ZА-ЯЁЎҚҒҲ]/gu)||[])}
function crossLayout(words){
  const W=words.map(x=>({cl:cellsOf(x.word),clue:String(x.clue||'')})).filter(x=>x.cl.length>=2&&x.cl.length<=14);
  let best=null;
  for(let at=0;at<80;at++){
    const order=at===0?[...W].sort((a,b)=>b.cl.length-a.cl.length):[...W].sort(()=>Math.random()-.5);
    const G=new Map(),placed=[];const key=(r,c)=>r+','+c;
    const can=(w,r,c,dir)=>{const dr=dir?1:0,dc=dir?0:1;let cross=0;
      if(G.has(key(r-dr,c-dc))||G.has(key(r+dr*w.length,c+dc*w.length)))return -1;
      for(let k=0;k<w.length;k++){const rr=r+dr*k,cc=c+dc*k,g=G.get(key(rr,cc));
        if(g){if(g.l!==w[k]||g[dir?'v':'h'])return -1;cross++}
        else if(G.has(key(rr+dc,cc+dr))||G.has(key(rr-dc,cc-dr)))return -1}
      return cross};
    const put=(x,r,c,dir)=>{const dr=dir?1:0,dc=dir?0:1;x.cl.forEach((l,k)=>{const kk=key(r+dr*k,c+dc*k),g=G.get(kk)||{l};g[dir?'v':'h']=1;G.set(kk,g)});placed.push({...x,r,c,dir})};
    order.forEach((x,ix)=>{
      if(!placed.length){put(x,0,0,0);return}
      let cands=[];
      placed.forEach(p=>p.cl.forEach((l,k)=>x.cl.forEach((m,j)=>{if(l!==m)return;const dir=p.dir?0:1;
        const pr=p.r+(p.dir?k:0),pc=p.c+(p.dir?0:k),r=pr-(dir?j:0),c=pc-(dir?0:j),s=can(x.cl,r,c,dir);if(s>0)cands.push([s,r,c,dir])})));
      if(!cands.length)return;cands.sort((a,b)=>b[0]-a[0]||Math.random()-.5);const [s,r,c,dir]=cands[0];put(x,r,c,dir)});
    const rs=placed.flatMap(p=>[p.r,p.r+(p.dir?p.cl.length-1:0)]),cs=placed.flatMap(p=>[p.c,p.c+(p.dir?0:p.cl.length-1)]);
    const h=Math.max(...rs)-Math.min(...rs)+1,w=Math.max(...cs)-Math.min(...cs)+1;
    const score=placed.length*1000-h*w-Math.abs(h-w)*8;
    if(!best||score>best.score)best={score,placed:placed.map(p=>({...p,r:p.r-Math.min(...rs),c:p.c-Math.min(...cs)})),h,w};
    if(best.placed.length===W.length&&at>25)break;
  }
  if(!best)return{h:0,w:0,words:[]};
  const starts={};let num=0;
  best.placed.sort((a,b)=>a.r-b.r||a.c-b.c).forEach(p=>{const k=p.r+','+p.c;if(!starts[k])starts[k]=++num;p.n=starts[k]});
  return{h:best.h,w:best.w,words:best.placed.map(p=>({n:p.n,r:p.r,c:p.c,dir:p.dir,a:p.cl.join('|'),clue:p.clue})),missed:W.length-best.placed.length};
}
function crossHtml(d,L){
  const cell={};L.words.forEach(w=>w.a.split('|').forEach((l,k)=>{const r=w.r+(w.dir?k:0),c=w.c+(w.dir?0:k);cell[r+','+c]={l,n:(k===0?w.n:(cell[r+','+c]||{}).n)}}));
  L.words.forEach(w=>{const k=w.r+','+w.c;cell[k].n=w.n});
  const grid=(ans)=>`<table class="cw ${ans?'ans':''}">${[...Array(L.h)].map((_,r)=>`<tr>${[...Array(L.w)].map((_,c)=>{const x=cell[r+','+c];
    return x?`<td>${x.n?`<small>${x.n}</small>`:''}${ans?`<span>${esc(x.l)}</span>`:`<input maxlength="2" data-l="${esc(x.l)}" aria-label="katak">`}</td>`:'<td class="x"></td>'}).join('')}</tr>`).join('')}</table>`;
  const list=dir=>L.words.filter(w=>w.dir===dir).sort((a,b)=>a.n-b.n).map(w=>`<li value="${w.n}">${ex(w.clue)} <em>(${w.a.split('|').length})</em></li>`).join('');
  return `<h1>${esc(d.title)}</h1><div class="cwrap"><div class="cgrid">${grid(false)}</div>
   <div class="clues"><h2>➡️ Gorizontal</h2><ol>${list(0)}</ol><h2>⬇️ Vertikal</h2><ol>${list(1)}</ol></div></div>

function bindCross(){const ins=[...document.querySelectorAll('.cw input')];

  const g=i.value.trim()===i.dataset.l;if(i.value){i.classList.toggle('good',g);i.classList.toggle('bad',!g)}if(g)ok++});

function md(s){
  const lines=esc(s).split('\n');let out='',list=null,code=false,buf=[];
  const inl=t=>frac(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const flush=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const ln of lines){
    if(ln.trim().startsWith('```')){if(code){out+=`<pre>${buf.join('\n')}</pre>`;buf=[];code=false}else{flush();code=true}continue}
    if(code){buf.push(ln);continue}
    let m;
    if(m=ln.match(/^\s*#{1,4}\s+(.*)/)){flush();out+=`<h4>${inl(m[1])}</h4>`;continue}
    if(m=ln.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){flush();out+='<ul>';list='ul'}out+=`<li>${inl(m[1])}</li>`;continue}
    if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){flush();out+='<ol>';list='ol'}out+=`<li>${inl(m[1])}</li>`;continue}
    if(/^\s*\|/.test(ln)){flush();if(/^\s*\|[\s:|-]+\|\s*$/.test(ln))continue;out+=`<div class="trow">${ln.split('|').slice(1,-1).map(c=>`<span>${inl(c.trim())}</span>`).join('')}</div>`;continue}
    flush();if(ln.trim())out+=`<p>${inl(ln)}</p>`}
  if(code)out+=`<pre>${buf.join('\n')}</pre>`;flush();return out}
function bindChat(){
  let H=store.get('chat',[])||[];let file=null;
  const box=$('#msgs'),ta=$('#cText');
  const draw=()=>{box.innerHTML=H.length?H.map(m=>`<div class="msg ${m.role}">${m.role==='model'?md(m.text):esc(m.text).replace(/\n/g,'<br>')}${m.f?`<small>📎 ${esc(m.f)}</small>`:''}</div>`).join('')
    :`<div class="cempty"><div>💬</div><b>Nimadan boshlaymiz?</b><div class="sugs">${['5-sinf uchun kasrlar mavzusida 10 daqiqalik oʻyin gʻoyasi','Perimetr va yuzni farqlashni qanday tushuntiraman?','Ota-onalar majlisi uchun qisqa nutq rejasi','7-sinf: chiziqli tenglamalarga 5 ta hayotiy masala'].map(s=>`<button class="chip">${esc(s)}</button>`).join('')}</div></div>`;
    box.scrollTop=box.scrollHeight;box.querySelectorAll('.sugs .chip').forEach(b=>b.onclick=()=>{ta.value=b.textContent;send()})};
  const save=()=>store.set('chat',H.slice(-40));
  async function send(){const t=ta.value.trim();if(!t)return;
    if(!AUTH.tok){const ok=await login();if(!ok)return}
    H.push({role:'user',text:t,f:file&&file.name});ta.value='';ta.style.height='';draw();save();
    const wait=document.createElement('div');wait.className='msg model typing';wait.innerHTML='<i></i><i></i><i></i>';box.appendChild(wait);box.scrollTop=box.scrollHeight;
    const f=file;file=null;$('#cFileName').textContent='';
    try{const j=await api('/api/chat',{token:AUTH.tok,messages:H.map(m=>({role:m.role,text:m.text})),file:f&&{mime:f.mime,data:f.data}});H.push({role:'model',text:j.text})}
    catch(e){H.push({role:'model',text:'⚠️ '+e.message})}
    save();draw()}
  $('#cForm').onsubmit=e=>{e.preventDefault();send()};
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
  ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,160)+'px'};
  $('#cFile').onchange=async e=>{const f0=e.target.files[0];if(!f0)return;if(f0.size>7*1024*1024){toast('Fayl 7 MB dan katta');return}
    file={name:f0.name,mime:f0.type,data:await fileToB64(f0)};$('#cFileName').textContent='📎 '+f0.name};
  $('#newChat').onclick=()=>{H=[];save();draw()};
  draw();
}
